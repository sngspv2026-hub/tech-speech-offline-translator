name: Android Offline Translator CI & Signed Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Structural, Security & Technical Phrase Tests
        run: |
          python scripts/verify_project_integrity.py
          python scripts/evaluate_technical_test_suite.py

      - name: Run All Unit & Live 6-Direction Translation Tests across 18 modules
        run: ./gradlew testStandardDebugUnitTest --rerun-tasks --info | grep -E "LIVE TEST|PASSED|FAILED|BUILD SUCCESSFUL|BUILD FAILED" || true
        continue-on-error: false

      - name: Verify All Unit Tests Exit 0
        run: ./gradlew testStandardDebugUnitTest

      - name: Generate Release Signing Keystore (CI Ephemeral)
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release-signing.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias techspeech_release \
            -storepass "TechSpeech2026Release" \
            -keypass "TechSpeech2026Release" \
            -dname "CN=TechSpeech Translator, OU=Engineering, O=OfflineTech, L=Moscow, C=RU"

      - name: Clean & Assemble Signed Release APK, Release AAB & Debug APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-signing.jks
          RELEASE_STORE_PASSWORD: TechSpeech2026Release
          RELEASE_KEY_ALIAS: techspeech_release
          RELEASE_KEY_PASSWORD: TechSpeech2026Release
        run: |
          ./gradlew :app:assembleStandardRelease :app:bundleStandardRelease :app:assembleAirgappedRelease :app:assembleStandardDebug

      - name: Verify APK Signature & Print Artifact Sizes
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/standard/release/app-standard-release.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/airgapped/release/app-airgapped-release.apk
          ls -lh app/build/outputs/apk/standard/release/*.apk
          ls -lh app/build/outputs/apk/airgapped/release/*.apk
          ls -lh app/build/outputs/bundle/standardRelease/*.aab

      - name: Upload Signed APKs and AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tech-speech-translator-v2-release-artifacts
          path: |
            app/build/outputs/apk/standard/release/app-standard-release.apk
            app/build/outputs/apk/airgapped/release/app-airgapped-release.apk
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/bundle/standardRelease/app-standard-release.aab
