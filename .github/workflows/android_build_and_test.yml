name: Android Offline Translator CI & APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Structural, Permission Isolation & Technical Phrase Tests
        run: |
          python scripts/verify_project_integrity.py
          python scripts/evaluate_technical_test_suite.py

      - name: Build Default Offline Language Packs (.tpk)
        run: |
          python scripts/convert_and_package_models.py --pack-id org.offline.translate.pack.ru_en_core --version 1.2.0 --source-lang ru --target-lang en --routing DIRECT --output dist/pack_ru_en_v1.2.0.tpk --dry-run
          python scripts/convert_and_package_models.py --pack-id org.offline.translate.pack.tr_en_pivot_ru --version 1.2.0 --source-lang ru --target-lang tr --routing PIVOT --pivot-lang en --output dist/pack_tr_en_pivot_ru_v1.2.0.tpk --dry-run
          python scripts/convert_and_package_models.py --pack-id org.offline.translate.pack.ru_tr_direct --version 1.0.0 --source-lang ru --target-lang tr --routing DIRECT --output dist/pack_ru_tr_direct_v1.0.0.tpk --dry-run

      - name: Run Gradle Unit Tests across all 18 modules
        run: ./gradlew testStandardDebugUnitTest

      - name: Assemble Standard and Air-Gapped APKs
        run: ./gradlew :app:assembleStandardDebug :app:assembleAirgappedDebug

      - name: Upload Built APKs and Offline Language Packs (.tpk)
        uses: actions/upload-artifact@v4
        with:
          name: tech-speech-offline-translator-apks-and-packs
          path: |
            app/build/outputs/apk/**/*.apk
            dist/*.tpk
